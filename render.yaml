services:
  - type: web
    name: hey-buss-backend
    runtime: node
    plan: free
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: CONDUCTOR_PIN
        sync: false
